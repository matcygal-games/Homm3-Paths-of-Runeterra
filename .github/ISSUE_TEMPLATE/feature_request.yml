name: Feature request
description: Suggest an improvement
title: "[Feature]: "
body:
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to improve?
      description: Explain the problem, the proposed change and the affected region or system.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant references and rights information for any proposed artwork.
